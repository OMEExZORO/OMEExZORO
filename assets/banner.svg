<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="55%" stop-color="#0e1220"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8862f"/>
      <stop offset="50%" stop-color="#f3d27a"/>
      <stop offset="100%" stop-color="#b8862f"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d27a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f3d27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    .ring{transform-origin:960px 160px;animation:spin 24s linear infinite}
    .ring2{transform-origin:960px 160px;animation:spin 16s linear infinite reverse}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .rise{opacity:0;animation:rise 1.2s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
    .scan{animation:scan 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
  </style>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="120" height="320" fill="#f3d27a" opacity="0.035"/>
  <circle cx="960" cy="160" r="150" fill="url(#glow)" class="pulse"/>
  <g class="ring">
    <circle cx="960" cy="160" r="110" fill="none" stroke="#f3d27a" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="1070" cy="160" r="5" fill="#f3d27a"/>
  </g>
  <g class="ring2">
    <circle cx="960" cy="160" r="72" fill="none" stroke="#7aa2f7" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="60 20"/>
    <circle cx="888" cy="160" r="4" fill="#7aa2f7"/>
  </g>
  <polygon points="960,118 996,180 924,180" fill="none" stroke="url(#gold)" stroke-width="2.5" class="pulse"/>
  <text x="960" y="210" text-anchor="middle" class="m" font-size="11" fill="#f3d27a" fill-opacity="0.7" letter-spacing="4">KAIROS</text>
  <text x="70" y="130" class="t rise d1" font-size="78" font-weight="800" fill="url(#gold)" letter-spacing="6">OM SOMA</text>
  <text x="74" y="172" class="m rise d2" font-size="18" fill="#c9d1e0" letter-spacing="7">INVICTUS KAIROS</text>
  <rect x="74" y="192" width="64" height="3" fill="#f3d27a" class="rise d2"/>
  <text x="74" y="232" class="t rise d3" font-size="20" fill="#e6e9f0">AI systems that ship. Research that publishes. Automation that pays.</text>
  <text x="74" y="266" class="m rise d3" font-size="14" fill="#8b93a7">Computer Engineering @ VIT Pune  ·  Springer-published  ·  Hackathon builder</text>
</svg>
