<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
    .in{opacity:0;animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
    .rule{transform-origin:80px 0;transform:scaleX(0);animation:draw 1s .5s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes draw{to{transform:scaleX(1)}}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="#fafafa" stroke="#e4e4e7"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#glow)"/>
  <text x="80" y="104" class="mono in d1" font-size="13" letter-spacing="4" fill="#71717a">COMPUTER ENGINEERING  ·  VIT PUNE</text>
  <text x="76" y="178" class="sans in d2" font-size="72" font-weight="600" letter-spacing="-1.5" fill="#18181b">Om Soma</text>
  <rect x="80" y="206" width="48" height="2" fill="#a8841f" class="rule"/>
  <text x="80" y="248" class="sans in d3" font-size="19" fill="#52525b">Applied AI  ·  Research  ·  Automation</text>
  <text x="1120" y="248" text-anchor="end" class="mono in d3" font-size="12" letter-spacing="3" fill="#a1a1aa">INVICTUS KAIROS</text>
</svg>
